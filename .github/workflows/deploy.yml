name: Deploy to Railway
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect and deploy
        run: |
          RAILWAY_TOKEN="${{ secrets.RAILWAY_TOKEN }}"
          GITHUB_SHA="${{ github.sha }}"
          curl -s https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { serviceConnect(id: \"e4687ebe-a165-49d3-be73-d9fdd847f3d6\", input: { repo: \"GarryAssistant/drive-bot\", branch: \"main\" }) { id } }"}'
          echo ""
          echo "Connected, deploying..."
          curl -s https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"mutation { serviceInstanceDeployV2(environmentId: \\\"4449459d-cf4a-4c77-8d3f-51d503035952\\\", serviceId: \\\"e4687ebe-a165-49d3-be73-d9fdd847f3d6\\\", commitSha: \\\"$GITHUB_SHA\\\") }\"}"
